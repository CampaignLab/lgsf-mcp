[project]
name = "lgsf-mcp"
version = "0.1.0"
description = "MCP server over the Council Gateway API (UK local government data)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
lgsf-mcp = "lgsf_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pytest-timeout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
